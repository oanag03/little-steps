
<!DOCTYPE html>
<html lang="ro">
<head>

  <title>Little Steps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Little Steps 🌸</h1>

  </main>

  <script src="script.js"></script>
</body>
